# Server configuration
server.port=8081

# Default Data Source Configuration (with Environment Variable Override for MySQL)
# To use MySQL: Set SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/insurai_db?createDatabaseIfNotExist=true
#               and SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:insuraidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# JWT Security
jwt.secret=InsurAIEnterpriseSecureJwtSecretKeyMustBe32BytesOrLonger
jwt.expiration=86400000
